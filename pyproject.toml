[project]
name = "athene-opt"
version = "0.1.0"
description = "Goal-seeking search (GA, tabu, annealing) over parameter spaces with stochastic, ensemble evaluation"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = ["numpy"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["athene"]
package-dir = {"athene" = "."}
